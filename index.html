<style>
/* =========================
   NEW CINEMATIC ENTRY SCREEN
========================= */

#entryScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#020817;
    transition:
        opacity 1s ease,
        visibility 1s ease,
        transform 1.1s ease;
}

#entryScreen.hide{
    opacity:0;
    visibility:hidden;
    transform:scale(1.06);
    pointer-events:none;
}

/* NIGHT SKY */

.entry-bg{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(53,142,255,.20),
            transparent 27%
        ),
        radial-gradient(
            circle at 15% 15%,
            rgba(40,102,220,.14),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #010718 0%,
            #04142f 38%,
            #082654 67%,
            #020817 100%
        );
}

/* SOFT MOON */

.entry-moon{
    position:absolute;
    width:105px;
    height:105px;
    border-radius:50%;
    top:28%;
    left:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #dcecff 55%,
            #a9cfff 100%
        );
    box-shadow:
        0 0 25px rgba(180,220,255,.65),
        0 0 75px rgba(76,156,255,.30),
        0 0 140px rgba(46,116,255,.16);
    opacity:.95;
}

/* MOON HAZE */

.entry-moon::before{
    content:"";
    position:absolute;
    inset:-45px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(100,174,255,.16),
        transparent 65%
    );
}

/* STARS */

.entry-stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(111,183,255,.65) 1px,transparent 1.5px);
    background-size:
        83px 83px,
        137px 137px;
    background-position:
        10px 20px,
        50px 70px;
    opacity:.55;
    animation:starsMove 18s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-70px);
    }
}

/* FLOATING LIGHTS */

.entry-particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 18% 32%,rgba(100,185,255,.7) 0 1px,transparent 2px),
        radial-gradient(circle at 76% 23%,rgba(255,255,255,.8) 0 1px,transparent 2px),
        radial-gradient(circle at 86% 55%,rgba(92,174,255,.7) 0 1px,transparent 2px),
        radial-gradient(circle at 25% 67%,rgba(255,255,255,.6) 0 1px,transparent 2px),
        radial-gradient(circle at 66% 76%,rgba(95,180,255,.6) 0 1px,transparent 2px);
    animation:particleFloat 7s ease-in-out infinite alternate;
}

@keyframes particleFloat{
    from{
        transform:translateY(8px);
        opacity:.35;
    }
    to{
        transform:translateY(-12px);
        opacity:.8;
    }
}

/* CITY SILHOUETTE */

.entry-city{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:30%;
    background:
        linear-gradient(
            to top,
            #01050e 0%,
            #020916 70%,
            transparent 100%
        );
}

.entry-buildings{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:75%;
    display:flex;
    align-items:flex-end;
    gap:3px;
    opacity:.9;
}

.entry-buildings span{
    flex:1;
    min-width:12px;
    max-width:48px;
    background:
        linear-gradient(
            90deg,
            #020713,
            #071224
        );
    border-top:1px solid rgba(74,133,201,.18);
    position:relative;
}

.entry-buildings span::after{
    content:"";
    position:absolute;
    inset:10px 5px;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(96,163,224,.22) 0 3px,
            transparent 3px 14px
        );
}

/* FOREGROUND */

.entry-ground{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:13%;
    background:
        linear-gradient(
            180deg,
            #0a1525,
            #01040a
        );
    box-shadow:
        0 -15px 35px rgba(0,0,0,.45);
}

/* CHARACTER SILHOUETTE */

.entry-characters{
    position:absolute;
    z-index:5;
    bottom:10%;
    left:50%;
    transform:translateX(-50%);
    width:min(360px,82vw);
    height:185px;
}

/* DORAEMON SILHOUETTE */

.entry-doraemon{
    position:absolute;
    right:2%;
    bottom:0;
    width:120px;
    height:155px;
    border-radius:60px 60px 35px 35px;
    background:
        linear-gradient(
            135deg,
            #0b6fc5,
            #063b79
        );
    box-shadow:
        0 12px 35px rgba(0,0,0,.65);
}

.entry-doraemon::before{
    content:"";
    position:absolute;
    width:90px;
    height:72px;
    left:15px;
    top:25px;
    border-radius:50%;
    background:#eaf5ff;
    opacity:.95;
}

.entry-doraemon::after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#f04452;
    left:56px;
    top:51px;
    box-shadow:
        -20px -11px 0 2px #10151e,
        20px -11px 0 2px #10151e;
}

/* NOBITA SILHOUETTE */

.entry-boy{
    position:absolute;
    left:12%;
    bottom:0;
    width:82px;
    height:165px;
}

.entry-boy .head{
    position:absolute;
    width:58px;
    height:58px;
    left:12px;
    top:0;
    border-radius:50%;
    background:#172033;
    box-shadow:
        inset -7px -5px 0 rgba(0,0,0,.3);
}

.entry-boy .hair{
    position:absolute;
    width:63px;
    height:28px;
    left:9px;
    top:-2px;
    border-radius:50% 50% 35% 35%;
    background:#050911;
}

.entry-boy .body{
    position:absolute;
    width:68px;
    height:92px;
    left:7px;
    bottom:20px;
    border-radius:25px 25px 8px 8px;
    background:
        linear-gradient(
            90deg,
            #152036,
            #243550
        );
}

.entry-boy .legs{
    position:absolute;
    width:65px;
    height:25px;
    left:9px;
    bottom:0;
    background:#080d18;
    border-radius:20px;
}

/* ENTRY CONTENT */

.entry-content{
    position:absolute;
    z-index:20;
    top:8%;
    width:100%;
    text-align:center;
    padding:20px;
}

.entry-small{
    font-size:10px;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#80bfff;
    margin-bottom:15px;
    text-shadow:0 0 18px rgba(76,160,255,.5);
}

.entry-title{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(29px,8vw,62px);
    line-height:1.08;
    letter-spacing:2px;
    text-shadow:
        0 5px 25px rgba(0,0,0,.7),
        0 0 35px rgba(70,155,255,.18);
}

.entry-title span{
    display:block;
    color:#fff;
}

.entry-title span:last-child{
    color:#61b4ff;
}

.entry-subtitle{
    max-width:330px;
    margin:17px auto 0;
    font-size:12px;
    line-height:1.8;
    color:rgba(221,237,255,.78);
}

/* ENTER BUTTON */

.enter-btn{
    margin-top:27px;
    position:relative;
    min-width:175px;
    padding:15px 42px;
    border-radius:50px;
    border:1px solid rgba(132,202,255,.5);
    background:
        linear-gradient(
            135deg,
            rgba(16,102,205,.95),
            rgba(35,157,255,.9)
        );
    color:#fff;
    font-family:'Orbitron',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    cursor:pointer;
    overflow:hidden;
    box-shadow:
        0 0 25px rgba(32,143,255,.4),
        0 12px 35px rgba(0,0,0,.45);
    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.enter-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.65),
        transparent
    );
    transform:skewX(-20deg);
    animation:buttonSweep 3s infinite;
}

@keyframes buttonSweep{
    0%{left:-120%;}
    55%,100%{left:145%;}
}

.enter-btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 0 35px rgba(40,160,255,.65),
        0 15px 40px rgba(0,0,0,.5);
}

.enter-btn:active{
    transform:scale(.94);
}

/* MOBILE */

@media(max-width:600px){

    .entry-content{
        top:6%;
        padding:18px;
    }

    .entry-small{
        font-size:8px;
        letter-spacing:3.5px;
    }

    .entry-title{
        font-size:31px;
    }

    .entry-subtitle{
        max-width:285px;
        font-size:11px;
        margin-top:14px;
    }

    .entry-moon{
        width:78px;
        height:78px;
        top:29%;
    }

    .entry-characters{
        bottom:10%;
        transform:translateX(-50%) scale(.78);
        transform-origin:bottom center;
    }

    .enter-btn{
        margin-top:21px;
        min-width:160px;
        padding:14px 32px;
    }

    .entry-city{
        height:27%;
    }
}
</style>


<!-- =========================================
     NEW CINEMATIC ENTRY
========================================= -->

<div id="entryScreen">

    <div class="entry-bg"></div>

    <div class="entry-stars"></div>

    <div class="entry-particles"></div>

    <div class="entry-moon"></div>

    <div class="entry-city">

        <div class="entry-buildings">

            <span style="height:48%"></span>
            <span style="height:68%"></span>
            <span style="height:42%"></span>
            <span style="height:78%"></span>
            <span style="height:55%"></span>
            <span style="height:88%"></span>
            <span style="height:46%"></span>
            <span style="height:72%"></span>
            <span style="height:52%"></span>
            <span style="height:81%"></span>
            <span style="height:44%"></span>
            <span style="height:64%"></span>
            <span style="height:76%"></span>
            <span style="height:57%"></span>
            <span style="height:70%"></span>
            <span style="height:49%"></span>

        </div>

    </div>

    <div class="entry-ground"></div>


    <!-- CINEMATIC CHARACTERS -->

    <div class="entry-characters">

        <div class="entry-boy">
            <div class="head"></div>
            <div class="hair"></div>
            <div class="body"></div>
            <div class="legs"></div>
        </div>

        <div class="entry-doraemon"></div>

    </div>


    <!-- ENTRY TEXT -->

    <div class="entry-content">

        <div class="entry-small">
            A LITTLE WORLD OF FRIENDSHIP
        </div>

        <div class="entry-title">
            <span>BEST FRIENDS</span>
            <span>FOREVER</span>
        </div>

        <p class="entry-subtitle">
            A small blue robot with a big heart...
            and an endless friendship that never ends.
        </p>

        <button class="enter-btn" id="enterBtn">
            ENTER
        </button>

    </div>

</div>
